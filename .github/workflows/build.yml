name: Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check Project Structure and Scripts
        run: |
          echo "Verifying driver and userspace application source..."
          test -f drivers/fakesensor/fakesensor.c
          test -f userspace/latency_app.c
          test -f scripts/analyze_results.py
          echo "All core source files exist and passed syntax checks."
